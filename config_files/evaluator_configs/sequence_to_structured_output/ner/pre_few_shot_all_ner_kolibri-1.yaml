model: hf
model_args:
  pretrained: Aleph-Alpha/Kolibri-1
  dtype: bfloat16

include_path: tasks
tasks:
  - cofun_ner
  - archaeo_ner
  - wiki_biography_ner
  - fairagro_de_ner
  - europarl-ner #should it be newsplit?
  - swiss-ner
  - nostad-ner
  - ehri_holocaust_ner
  - zurich_state_archive_ner
  - german_ler_ner
  - ger_ps_ns
  - ger_med_ner
