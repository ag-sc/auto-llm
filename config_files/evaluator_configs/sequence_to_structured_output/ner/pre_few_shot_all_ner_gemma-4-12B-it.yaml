  project: german-ner-eval
  entity: llm4kmu
  name: pre_few_shot_all_ner_gemma-4-12B-it
  tags:
    - gemma-4-12B-it
    - few_shot
    - cofun_ner
    - archaeo_ner
    - wiki_biography_ner
    - fairagro_de_ner
