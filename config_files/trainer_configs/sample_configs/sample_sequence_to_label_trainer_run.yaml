auto_llm_trainer_args:
  trainer_type: sft
  model_name: google/gemma-2-2b
  attn_implementation: eager # keep eager for gemma
  truncation: True
  completion_only_loss: True

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

trainer_data_builder_config:
  dataset_dir: llm-4-kmu/qa_pubmed_gen_qa
  instruction_template: "Answer the following Question based on the given Context. Answer with a 'yes', 'no' or 'maybe'."
  input_template: "{{input}}\nAnswer:"
  output_template: "{{output}}"
  dataset_type: prompt_completions
  instruction_input_separator: "\n"
  parse_output_as_json: False

trainer_args:
  max_length: 1024
  bf16: True
  fp16: False

  # bsz related
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32  # 1 process
  auto_find_batch_size: False

  # training related
  output_dir: /vol/auto_llm/sft_models/sample_sequence_to_label_trainer_run
  # resume_from_checkpoint: ""
  gradient_checkpointing: True
  num_train_epochs: 1
  learning_rate: 1e-4
  warmup_steps: 0

  # tracking/logging related
  report_to: wandb
  run_name: sample_sequence_to_label_trainer_run
  logging_steps: 0.1

  # eval/save related
  eval_strategy: steps
  save_strategy: epoch
