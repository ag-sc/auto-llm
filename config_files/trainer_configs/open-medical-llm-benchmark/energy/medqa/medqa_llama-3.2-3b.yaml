auto_llm_trainer_args:
  trainer_type: sft
  model_name: meta-llama/Llama-3.2-3B
  attn_implementation: sdpa
  truncation: True
  completion_only_loss: True
  energy_profiling: true
  force_cpu_power: 450 # 2× AMD EPYC 7713 @ 225W
  
  # token_budget: 200000000 # 200M tokens

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

trainer_data_builder_config:
  dataset_dir: /vol/auto_llm/processed_datasets/open-medical-llm-benchmark/medqa
  instruction_template: "Answer the following medical question by selecting the correct option (A, B, C, or D)."
  input_template: "{{input}}\nAnswer:"
  output_template: " {{output}}"
  dataset_type: prompt_completions
  instruction_input_separator: "\n"
  parse_output_as_json: False

trainer_args:
  max_length: 512
  bf16: True
  fp16: False

  # bsz related
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  auto_find_batch_size: True

  # training related
  output_dir: /vol/auto_llm/sft_models/open-medical-llm-benchmark/energy/medqa_llama-3.2-3b
  gradient_checkpointing: True
  num_train_epochs: 5 # overridden by token_budget -> max_steps
  learning_rate: 1e-4
  warmup_steps: 10

  # tracking/logging related
  report_to: wandb
  run_name: medqa_llama-3.2-3b_energy
  logging_steps: 100

  # eval/save related
  eval_strategy: steps
  save_strategy: epoch
  save_total_limit: 1      # rotate — keep only the latest
  save_only_model: True    # skip optimizer/scheduler/rng state in checkpoints
