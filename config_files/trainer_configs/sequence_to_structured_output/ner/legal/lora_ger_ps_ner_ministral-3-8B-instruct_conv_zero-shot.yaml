auto_llm_trainer_args:
  trainer_type: sft
  model_name: mistralai/Ministral-3-8B-Instruct-2512-BF16
  attn_implementation: sdpa  # flash_attention_2
  truncation: True
  completion_only_loss: True

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"


tracker_config:
  wandb_project: german-ner-train
  wandb_run_name: lora_ger_ps_ner_ministral-3-8B-instruct_conv_zero-shot
  wandb_run_type: training  

trainer_data_builder_config:
  dataset_dir: llm-4-kmu/ger-ps-ner
  instruction_template: |
    Du bist ein präzises System zur Named Entity Recognition (NER). Deine Aufgabe ist es, strukturierte Entitäten aus dem bereitgestellten Text zu extrahieren und ausschließlich als valides JSON-Objekt zurückzugeben.

    ### Entitätstypen:
    * **Mitwirkender**: Eine Person oder Rolle, die den Hauptakteur bei der Durchführung einer Aktion unterstützt (z. B. durch Zuarbeit oder Freigabe).
    * **Handlungsgrundlage**: Das Dokument, Gesetz, die Richtlinie oder der Vertrag, der festlegt, warum eine Aktion durchgeführt werden darf oder muss.
    * **Ergebnisempfänger**: Die Person, Abteilung oder das System, die das Endprodukt, die Information oder das Resultat einer Aktion erhält.
    * **Hauptakteur**: Die primäre Person, Rolle oder das System, das dafür verantwortlich ist, die beschriebene Aktion aktiv auszuführen.
    * **Aktion**: Die konkrete Tätigkeit, der Arbeitsschritt oder die Aufgabe, die ausgeführt wird (z. B. "prüfen", "senden", "erstellen").
    * **Dokument**: Das physische oder digitale Objekt (z. B. Bericht, Antrag, Rechnung), das in der Aktion verwendet, bearbeitet oder erzeugt wird.
    * **Signalwort**: Ein Begriff im Text, der auf eine Pflicht, ein Recht oder eine zeitliche Relevanz hinweist (z. B. "muss", "sollte", "unverzüglich").
    * **Frist**: Der zeitliche Rahmen oder der exakte Stichtag, bis zu dem die Aktion abgeschlossen sein muss.
    * **Bedingung**: Eine Voraussetzung oder ein Ereignis, das erfüllt sein muss, damit die Aktion überhaupt startet oder in Kraft tritt (z. B. "Wenn X passiert, dann...").
    * **Datenfeld**: Ein spezifisches Informationselement oder Attribut aus dem Text, das in ein System eingetragen oder digital erfasst werden muss (z. B. "Rechnungsnummer", "Geburtsdatum").

    ### Regeln:
    1. Extrahiere die Werte genau so, wie sie im Text vorkommen. Modifiziere oder korrigiere die Sätze oder Wörter nicht.
    2. Wenn eine Entität im Text nicht vorkommt, gib ein leeres Array [] für diesen Schlüssel an.
    3. WICHTIG: Das JSON muss absolut valide sein. Setze NIEMALS ein Komma nach dem letzten Element ("Datenfeld"). Vermeide jegliche Syntaxfehler.
    4. Antworte ausschließlich im folgenden JSON-Format, eingeschlossen in ```json ... ``` Code-Blöcke. Schreibe keinen einleitenden oder erklärenden Text.

    ### Ziel-Format:
    ```json
    {
      "Mitwirkender": ["Wert für Mitwirkender"],
      "Handlungsgrundlage": ["Wert für Handlungsgrundlage"],
      "Ergebnisempfänger": ["Wert für Ergebnisempfänger"],
      "Hauptakteur": ["Wert für Hauptakteur"],
      "Aktion": ["Wert für Aktion"],
      "Dokument": ["Wert für Dokument"],
      "Signalwort": ["Wert für Signalwort"],
      "Frist": ["Wert für Frist"],
      "Bedingung": ["Wert für Bedingung"],
      "Datenfeld": ["Wert für Datenfeld"]
    }
    ```
  
  input_template: |
    ### Eingabetext:
    "{{input}}"
    ### Extrahierte NER-Tags im JSON-Format:
  
  output_template: "```json\n{{output}}\n```"

  dataset_type: conversational
  use_system_message: True 
  instruction_input_separator: "\n"
  parse_output_as_json: True

trainer_args:
  max_length: 1024
  bf16: True
  fp16: False

  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 32
  auto_find_batch_size: False

  output_dir: /vol/auto_llm/sft_models/lora_ger_ps_ner_ministral-3-8B-instruct_conv_zero-shot
  gradient_checkpointing: True
  num_train_epochs: 20
  learning_rate: 1e-4
  warmup_steps: 10

  report_to: wandb
  logging_steps: 10

  eval_strategy: epoch
  save_strategy: "no"
  metric_for_best_model: eval_loss
  greater_is_better: false
  early_stopping_patience: 3
  early_stopping_threshold: 0.0
