auto_llm_trainer_args:
  trainer_type: sft
  model_name: mistralai/Ministral-3-8B-Instruct-2512-BF16
  attn_implementation: sdpa  # flash_attention_2
  truncation: True
  completion_only_loss: True

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"


tracker_config:
  wandb_project: german-ner-train
  wandb_run_name: lora_zurich_state_archive_ner_ministral-3-8B-instruct_conv_zero-shot
  wandb_run_type: training  

trainer_data_builder_config:
  dataset_dir: llm-4-kmu/zurich-state-archive-ner
  instruction_template: |
    Du bist ein präzises System zur Named Entity Recognition (NER). Deine Aufgabe ist es, strukturierte Entitäten aus dem bereitgestellten historischen und administrativen Text zu extrahieren und ausschließlich als valides JSON-Objekt zurückzugeben.

    ### Entitätstypen:
    * **PERS (Personen)**: Natürliche Personen. 
      * *Regeln*: Titel und Anreden werden grundsätzlich weggelassen (Ausnahme: Adelstitel wie "Erzherzog"). Konjunktionen von Nachnamen werden nicht hier, sondern als Organisationen behandelt. Derivierte Personennamen (z. B. "Tannersche") werden ebenfalls hier erfasst.
    * **PLACE (Orte)**: Geografische Entitäten und Umschreibungen.
      * *Regeln*: Neben eindeutigen Ortsbezeichnungen (Länder, Städte, Straßen) werden auch kontextuell eindeutige oder vagere Umschreibungen erfasst (z. B. "Bahnhofsquai", "Limmatraum", "Limmat"). Disambiguierende Präfixe (z. B. "[Kanton] Zürich") werden weggelassen. Hierarchische Ortsbezeichnungen (z. B. "Dillhaus / Saland") werden getrennt ausgezeichnet. Bindestrich-verknüpfte Verkettungen von Ortsnamen (z. B. Bahnlinien) als zusammenhängendes Token werden *nicht* ausgezeichnet. Derivierte Ortsnamen (z. B. "Zürcher", "schweizerischen", "St.Galler") werden mitaufgenommen.
    * **ORG (Organisationen)**: Unternehmen, Institutionen, Gerichte und administrative Körperschaften.
      * *Regeln*: Umfasst klassische Organisationen (Unternehmen, Universitäten) sowie Institutionen unterschiedlicher Konkretheit (z. B. "Regierungsrat", "Kantonsrat"). Untergeordnete Organisationen, temporäre Kommissionen oder im Dokument lediglich hypothetische Organisationen werden ebenfalls erfasst. 
      * *Konjunktionen*: Reine Konjunktionen werden nicht ausgezeichnet. Enthalten Konjunktionen jedoch eingeschachtelte, freistehende und kontextuell eindeutige Entitäten, werden diese separat oder als zusammengesetzte Organisation erfasst (z. B. "Kantonsspitäler [ZürichLOC] und [WinterthurLOC]" oder "[Direktionen der Finanzen und des MilitärsORG]"). Derivierte Organisationen (z. B. "kantonale", "parlamentarische", "bundesrätliche") werden mitaufgenommen.

    ### Regeln:
    1. Extrahiere die Werte genau so, wie sie im Text vorkommen. Modifiziere oder korrigiere die Sätze oder Wörter nicht.
    2. Wenn eine Entität im Text nicht vorkommt, gib ein leeres Array [] für diesen Schlüssel an.
    3. WICHTIG: Das JSON muss absolut valide sein. Setze NIEMALS ein Komma nach dem letzten Element ("PLACE"). Vermeide jegliche Syntaxfehler.
    4. Antworte ausschließlich im folgenden JSON-Format, eingeschlossen in ```json ... ``` Code-Blöcke. Schreibe keinen einleitenden oder erklärenden Text.

    ### Ziel-Format:
    ```json
    {
      "PERS": ["Wert für Person"],
      "ORG": ["Wert für Organisation"],
      "PLACE": ["Wert für Ort"]
    }
    ```
  
  input_template: |
    ### Eingabetext:
    "{{input}}"
    ### Extrahierte NER-Tags im JSON-Format:
  
  output_template: "```json\n{{output}}\n```"

  dataset_type: conversational
  use_system_message: True 
  instruction_input_separator: "\n"
  parse_output_as_json: True

trainer_args:
  max_length: 1024
  bf16: True
  fp16: False

  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 32
  auto_find_batch_size: False

  output_dir: /vol/auto_llm/sft_models/lora_zurich_state_archive_ner_ministral-3-8B-instruct_conv_zero-shot
  gradient_checkpointing: True
  num_train_epochs: 1
  learning_rate: 1e-4
  warmup_steps: 10

  report_to: wandb
  logging_steps: 10

  eval_strategy: steps
  save_strategy: epoch

