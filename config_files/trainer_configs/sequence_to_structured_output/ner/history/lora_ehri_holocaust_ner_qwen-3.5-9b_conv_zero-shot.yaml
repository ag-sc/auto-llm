auto_llm_trainer_args:
  trainer_type: sft
  model_name: Qwen/Qwen3.5-9B
  attn_implementation: sdpa  # flash_attention_2
  truncation: True
  completion_only_loss: True

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"


tracker_config:
  wandb_project: german-ner-train
  wandb_run_name: lora_ehri_holocaust_ner_qwen-3.5-9b_conv_zero-shot
  wandb_run_type: training  

trainer_data_builder_config:
  dataset_dir: llm-4-kmu/ehri-holocaust-ner
  instruction_template: |
    Du bist ein präzises System zur Named Entity Recognition (NER) für historische Dokumente des Holocausts. Deine Aufgabe ist es, strukturierte Entitäten aus dem bereitgestellten Text zu extrahieren und ausschließlich als valides JSON-Objekt zurückzugeben.

    ### Entitätstypen:
    * **PERS (Personen)**: Natürliche Personen, historische Akteure, Opfer, Überlebende oder Täter.
      * *Regeln*: Titel und Anreden werden grundsätzlich weggelassen. Derivierte Personennamen werden ebenfalls erfasst.
    * **LOC (Orte)**: Geografische Entitäten wie Länder, Städte, Herkunftsorte, Straßen oder Flüsse.
      * *Regeln*: Extrahiere eindeutige Ortsbezeichnungen sowie kontextuell eindeutige Umschreibungen. Derivierte Ortsnamen (z. B. "schon in Warschau wohnhaft") werden erfasst.
    * **ORG (Organisationen)**: Institutionen, Behörden, Verbände, Hilfsorganisationen oder militärische/administrative Einheiten.
      * *Regeln*: Umfasst offizielle Organe (z. B. "Reichssicherheitshauptamt", "Judenrat") sowie informelle oder temporäre Komitees.
    * **CAMP (Konzentrations- und Vernichtungslager)**: Spezifische Haft-, Arbeits-, Konzentrations- oder Vernichtungslager des NS-Regimes.
      * *Regeln*: Umfasst Hauptlager (z. B. "Auschwitz-Birkenau", "Dachau") sowie deren Außenlager und Nebenlager.
    * **DATE (Daten)**: Zeitliche Angaben, spezifische Daten oder Zeiträume.
      * *Regeln*: Extrahiere konkrete Daten (z. B. "1. September 1939") sowie unvollständige oder relative Zeitangaben (z. B. "im Frühjahr 1943", "Dezember '42").
    * **GHETTO (Ggettos)**: Spezifisch eingerichtete NS-Ggettos und jüdische Wohnbezirke.
      * *Regeln*: Orte, die explizit als Ghetto deklariert oder genutzt wurden (z. B. "Theresienstadt", "Ghetto Litzmannstadt").

    ### Regeln:
    1. Extrahiere die Werte genau so, wie sie im Text vorkommen. Modifiziere oder korrigiere die Sätze oder Wörter nicht.
    2. Wenn eine Entität im Text nicht vorkommt, gib ein leeres Array [] für diesen Schlüssel an.
    3. WICHTIG: Das JSON muss absolut valide sein. Setze NIEMALS ein Komma nach dem letzten Element ("GHETTO"). Vermeide jegliche Syntaxfehler.
    4. Antworte ausschließlich im folgenden JSON-Format, eingeschlossen in ```json ... ``` Code-Blöcke. Schreibe keinen einleitenden oder erklärenden Text.

    ### Ziel-Format:
    ```json
    {
      "PERS": [],
      "LOC": [],
      "ORG": [],
      "CAMP": [],
      "DATE": [],
      "GHETTO": []
    }
    ```  
  input_template: |
    ### Eingabetext:
    "{{input}}"
    ### Extrahierte NER-Tags im JSON-Format:
  
  output_template: "```json\n{{output}}\n```"

  dataset_type: conversational
  use_system_message: True 
  instruction_input_separator: "\n"
  parse_output_as_json: True

trainer_args:
  max_length: 1024
  bf16: True
  fp16: False

  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 32
  auto_find_batch_size: False

  output_dir: /vol/auto_llm/sft_models/lora_ehri_holocaust_ner_qwen-3.5-9b_conv_zero-shot
  gradient_checkpointing: True
  num_train_epochs: 1
  learning_rate: 1e-4
  warmup_steps: 10

  report_to: wandb
  logging_steps: 10

  eval_strategy: steps
  save_strategy: epoch

