auto_llm_trainer_args:
  trainer_type: sft
  model_name: google/gemma-2-2b
  attn_implementation: eager # keep eager for gemma
  truncation: True
  completion_only_loss: True
  
quantization_config:
  load_in_4bit: True
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: True
  bnb_4bit_compute_dtype: "float16"

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

trainer_data_builder_config:
  dataset_dir: /vol/auto_llm/processed_datasets/open-medical-llm-benchmark/medmcqa
  instruction_template: "Answer the following question based on the given context."
  input_template: "{{input}}\nAnswer:"
  output_template: "{{output}}"
  dataset_type: prompt_completions
  instruction_input_separator: "\n"
  parse_output_as_json: False

trainer_args:
  max_length: 8192
  bf16: True
  fp16: False

  # bsz related
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32  # 4 processes
  auto_find_batch_size: True

  # training related
  output_dir: /vol/auto_llm/sft_models/med_mcqa_gemma-2-2b_QLoRa
  gradient_checkpointing: True
  num_train_epochs: 5
  learning_rate: 1e-4
  warmup_steps: 10

  # tracking/logging related
  report_to: wandb
  run_name: med_mcqa_gemma-2-2b_QLoRa
  logging_steps: 0.1

  # eval/save related
  eval_strategy: steps
  save_strategy: epoch
