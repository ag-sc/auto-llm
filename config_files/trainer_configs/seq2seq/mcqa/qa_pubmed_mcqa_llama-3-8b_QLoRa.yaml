auto_llm_trainer_args:
  trainer_type: sft
  model_name: meta-llama/Meta-Llama-3-8B
  attn_implementation: sdpa
  truncation: True
  completion_only_loss: True

peft_config:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "all-linear"
  task_type: "CAUSAL_LM"

trainer_data_builder_config:
  dataset_dir: llm-4-kmu/qa_pubmed_mcqa
  instruction_template: "Answer the following question based on the given abstract. Answer only with a yes/no/maybe."
  input_template: "{{input}}\nAnswer:"
  output_template: "{{output}}"
  dataset_type: prompt_completions
  instruction_input_separator: "\n"
  parse_output_as_json: False

trainer_args:
  max_length: 8192
  bf16: True
  fp16: False

  # bsz related
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32  # 4 processes
  auto_find_batch_size: True

  # training related
  output_dir: /vol/auto_llm/sft_models/qa_pubmed_mcqa_llama-3-8b_qlora
  gradient_checkpointing: True
  num_train_epochs: 5
  learning_rate: 1e-4
  warmup_steps: 10

  # tracking/logging related
  report_to: wandb
  run_name: qa_pubmed_mcqa_llama-3-8b_qlora
  logging_steps: 0.1

  # eval/save related
  eval_strategy: steps
  save_strategy: epoch
