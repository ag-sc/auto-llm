tag:
  - pico

task: sequence_to_structured_output
test_split: test

doc_to_text: |
  Given the text "Text", extract the relevant tags in JSON format defined by the format below. 
  Do not modify the sentences.

  Format:
  ```json
  {
    "name of the <tag>": ["value of the <tag>"],
  }
  ```

  Text: {{input_text}}

  Relevant tags according to the format:
doc_to_target: "{{output_text}}"

process_results: !function utils.process_results

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: partial_match
    aggregation: mean
    higher_is_better: true
  - metric: fuzzy_match
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0