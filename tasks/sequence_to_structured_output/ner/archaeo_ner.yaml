tag:
  - ner

task: archaeo_ner

dataset_path: llm-4-kmu/ArchaeoNER
test_split: test


description: |
    Du bist ein präzises System zur Named Entity Recognition (NER). Deine Aufgabe ist es, strukturierte Entitäten aus dem bereitgestellten Text zu extrahieren und ausschließlich als valides JSON-Objekt zurückzugeben.

    ### Entitätstypen:
    * **ART**: Archäologische Artefakte und Objekte, d. h. von Menschen hergestellte oder bearbeitete Gegenstände (z. B. Keramik, Urnen, Werkzeuge).
    * **CON**: Archäologische Befunde und Kontexte, d. h. räumlich oder funktional definierte Strukturen wie Gräber, Gruben, Gräberfelder oder Siedlungsbefunde.
    * **LOC**: Geografische Ortsangaben wie Städte, Regionen, Länder oder archäologische Fundstätten.
    * **MAT**: Materialien und Rohstoffe, aus denen Objekte bestehen oder die im archäologischen Kontext vorkommen (z. B. Holz, Metall, Ton).
    * **PER**: Zeitliche Bezeichnungen wie archäologische Epochen, Perioden und Kulturen sowie Jahreszahlen und Datumsangaben (z. B. Jungneolithikum, Bronzezeit, 1990).
    * **SPE**: Biologische Arten, d. h. Namen von Tier- oder Pflanzenarten, die im archäologischen Kontext erwähnt werden.

    ### Regeln:
    1. Extrahiere die Werte genau so, wie sie im Text vorkommen. Modifiziere oder korrigiere die Sätze oder Wörter nicht.
    2. Wenn eine Entität im Text nicht vorkommt, gib ein leeres Array [] für diesen Schlüssel an.
    3. WICHTIG: Das JSON muss absolut valide sein. Setze NIEMALS ein Komma nach dem letzten Element ("SPE"). Vermeide jegliche Syntaxfehler.
    4. Antworte ausschließlich im folgenden JSON-Format, eingeschlossen in ```json ... ``` Code-Blöcke. Schreibe keinen einleitenden oder erklärenden Text.

    ### Ziel-Format:
    ```json
    {
      "ART": ["Wert für ART"],
      "CON": ["Wert für CON"],
      "LOC": ["Wert für LOC"],
      "MAT": ["Wert für MAT"],
      "PER": ["Wert für PER"],
      "SPE": ["Wert für SPE"]
    }
    ```

doc_to_text: |
  ### Eingabetext:
  "{{input_text}}"

  ### Extrahierte NER-Tags im JSON-Format:

doc_to_target: "{{output_text}}"

fewshot_config:
  sampler: default
  split: validation

  doc_to_target: |
    ```json
    {{output_text}}
    ```

process_results: !function utils.process_results

metadata:
  version: 1.0
