tag:
  - medical
  - mcqa
task: med_qa

dataset_path: bigbio/med_qa 
test_split: test

output_type: multiple_choice
doc_to_text: |
  The following are multiple choice questions (with answers) about medical knowledge.
  
  {{input_text}}
  
  Answer:
doc_to_target: "{{output_text}}"
doc_to_choice: ["A", "B", "C", "D", "E"]

metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0